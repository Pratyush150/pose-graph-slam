[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "posegraph"
version = "0.1.0"
description = "Pose-graph SLAM back end: SE(2)/SE(3) nonlinear least squares on NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pratyush Vatsa" }]
keywords = ["slam", "pose-graph", "robotics", "least-squares", "lie-groups", "g2o"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
sparse = ["scipy>=1.7"]
plots = ["matplotlib>=3.4"]
dev = ["pytest>=7.0", "scipy>=1.7", "matplotlib>=3.4"]

[project.scripts]
posegraph = "posegraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
